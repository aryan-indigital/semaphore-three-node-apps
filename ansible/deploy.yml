---
- name: Deploy the three Semaphore Node.js demo apps
  hosts: slave
  become: true
  gather_facts: true

  vars:
    app_root: /opt/semaphore-node-apps
    node_apps:
      - name: node-app-1
        directory: app-one
        port: 3001
        source_directory: "{{ playbook_dir }}/../apps/app-one"
      - name: node-app-2
        directory: app-two
        port: 3002
        source_directory: "{{ playbook_dir }}/../apps/app-two"
      - name: node-app-3
        directory: app-three
        port: 3003
        source_directory: "{{ playbook_dir }}/../apps/app-three"

  tasks:
    - name: Install Node.js runtime
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present
        update_cache: true

    - name: Create the application root
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ app_root }}/{{ item.directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ node_apps }}"

    - name: Deploy package manifests
      ansible.builtin.copy:
        src: "{{ item.source_directory }}/package.json"
        dest: "{{ app_root }}/{{ item.directory }}/package.json"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ node_apps }}"

    - name: Deploy Node.js application sources
      ansible.builtin.copy:
        src: "{{ item.source_directory }}/server.js"
        dest: "{{ app_root }}/{{ item.directory }}/server.js"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ node_apps }}"

    - name: Install systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} Semaphore demo service
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ app_root }}/{{ item.directory }}
          ExecStart=/usr/bin/node {{ app_root }}/{{ item.directory }}/server.js
          Environment=PORT={{ item.port }}
          Restart=always
          RestartSec=3
          User=root

          [Install]
          WantedBy=multi-user.target
      loop: "{{ node_apps }}"

    - name: Reload systemd after unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and restart the demo services
      ansible.builtin.systemd_service:
        name: "{{ item.name }}"
        enabled: true
        state: restarted
      loop: "{{ node_apps }}"

    - name: Verify every application health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port }}/health"
        method: GET
        status_code: 200
        return_content: true
      loop: "{{ node_apps }}"
